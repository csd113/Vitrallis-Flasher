[workspace]
members = ["crates/flasher-core", "crates/flasher-cli", "crates/flasher-gui", "crates/flasher-recovery"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
repository = "https://github.com/csd113/Vitrallis-Flasher"
license = "LicenseRef-Proprietary"
keywords = ["pocketchip", "recovery", "fel"]
categories = ["hardware-support"]

[workspace.dependencies]
ctrlc = "3.5"
flasher-core = { path = "crates/flasher-core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
tempfile = "3.27"
ring = "=0.17.14"
rusb = { version = "=0.9.4", features = ["vendored"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
