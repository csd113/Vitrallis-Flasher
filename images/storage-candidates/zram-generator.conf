# Candidate only: install in /etc/systemd/zram-generator.conf after device validation.
# Requires a reviewed, package-locked systemd-zram-generator; do not enable two managers.
[zram0]
zram-size = min(ram / 4, 128)
compression-algorithm = lz4
swap-priority = 100
# No writeback-device: compressed and incompressible pages must remain in RAM.
